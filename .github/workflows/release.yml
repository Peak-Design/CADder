name: Build & Release

on:
  # Manual trigger: click "Run workflow" in GitHub Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.3.0). Leave empty for test build.'
        required: false
        default: ''

  # Auto-trigger on version tags
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OCP_VERSION: 7.9.3.1.1
  OCCT_VERSION: 7.9.3

permissions:
  contents: write   # needed to create releases

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Windows (windows-x64)
  # ════════════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        # -e/-o pipefail: GitHub only injects fail-fast for the builtin
        # `shell: bash`; a custom template must ask for it explicitly, or
        # every multi-line step passes as long as its LAST command succeeds
        shell: bash -leo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
          python-version: '3.13'

      - name: Install OCCT and build tools
        run: |
          conda install -y -c conda-forge occt=${OCCT_VERSION}=novtk* numpy cmake

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build stepper_native
        run: |
          cd native
          mkdir build && cd build
          cmake .. \
            -G "NMake Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DPython3_EXECUTABLE="$(cygpath -w "$CONDA_PREFIX/python.exe")" \
            -DPython3_INCLUDE_DIR="$(cygpath -w "$CONDA_PREFIX/include")" \
            -DPython3_LIBRARY="$(cygpath -w "$CONDA_PREFIX/libs/python313.lib")" \
            -DOCCT_ROOT="$(cygpath -w "$CONDA_PREFIX/Library")"
          cmake --build . --config Release

      - name: Assemble extension
        run: |
          ADDON_DIR="STEPper_NEXT"
          mkdir -p "$ADDON_DIR/wheels" "$ADDON_DIR/native_libs"

          for f in __init__.py main.py importer.py import_ui.py uv.py tools.py formats.py curves.py analyzer.py background.py worker.py trimesh.py nurbs.py ocp_utils.py stepanalyzer.py updater.py refresh.py LICENSE README.md; do
            cp "$f" "$ADDON_DIR/"
          done
          if [ -d "docs" ]; then cp -r docs "$ADDON_DIR/docs"; fi

          WHEEL="cadquery_ocp_novtk-${OCP_VERSION}-cp313-cp313-win_amd64.whl"
          cp "wheels/$WHEEL" "$ADDON_DIR/wheels/"
          python ci/make_platform_manifest.py blender_manifest.toml windows-x64 "$WHEEL" "$ADDON_DIR/blender_manifest.toml"

          # Native module + its private plain-named OCCT subset (the wheel's
          # DLLs are name-mangled; only bytes cross the module boundary)
          cp native/build/stepper_native.pyd "$ADDON_DIR/stepper_native.cp313-win_amd64.pyd"
          for dll in TKernel TKMath TKBRep TKG2d TKG3d TKGeomBase TKGeomAlgo TKTopAlgo TKShHealing TKMesh; do
            cp "$CONDA_PREFIX/Library/bin/$dll.dll" "$ADDON_DIR/native_libs/"
          done

      - name: Smoke test
        run: |
          # Make OCP importable for the test by extracting the bundled wheel
          # (Blender does this via the manifest at install time)
          cd STEPper_NEXT && 7z x -y wheels/*.whl -otest_site >/dev/null && cd ..
          PYTHONPATH="$PWD/STEPper_NEXT/test_site" python ci/smoke_test.py STEPper_NEXT
          rm -rf STEPper_NEXT/test_site

      - name: Create zip
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('blender_manifest.toml','rb'))['version'])")
          cd STEPper_NEXT && 7z a "../stepper_next-${VERSION}-windows_x64.zip" . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: stepper_next-*-windows_x64.zip

  # ════════════════════════════════════════════════════════════════════
  # macOS (macos-arm64 native build + macos-x64 cross-compile)
  # ════════════════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-14
    defaults:
      run:
        # -e/-o pipefail: GitHub only injects fail-fast for the builtin
        # `shell: bash`; a custom template must ask for it explicitly, or
        # every multi-line step passes as long as its LAST command succeeds
        shell: bash -leo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
          python-version: '3.13'

      - name: Install OCCT and build tools (arm64 + x64 SDKs)
        run: |
          conda install -y -c conda-forge occt=${OCCT_VERSION}=novtk* numpy cmake ninja
          # x64 OCCT for cross-compiling (files only; never executed here)
          CONDA_SUBDIR=osx-64 conda create -y -p "$PWD/occt-x64" -c conda-forge occt=${OCCT_VERSION}=novtk*

      - name: Build stepper_native (arm64)
        run: |
          cd native
          mkdir build-arm64 && cd build-arm64
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPython3_EXECUTABLE="$CONDA_PREFIX/bin/python3"
          cmake --build . --config Release

      - name: Build stepper_native (x64 cross)
        run: |
          cd native
          mkdir build-x64 && cd build-x64
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DPython3_EXECUTABLE="$CONDA_PREFIX/bin/python3" \
            -DOCCT_ROOT="$GITHUB_WORKSPACE/occt-x64"
          cmake --build . --config Release
          lipo -archs stepper_native.so | grep -q x86_64

      - name: Assemble extensions (both mac platforms)
        run: |
          assemble() {
            local plat="$1" wheel_tag="$2" build_dir="$3" occt_prefix="$4"
            local dir="STEPper_NEXT-$plat"
            mkdir -p "$dir/wheels" "$dir/native_libs"

            for f in __init__.py main.py importer.py import_ui.py uv.py tools.py formats.py curves.py analyzer.py background.py worker.py trimesh.py nurbs.py ocp_utils.py stepanalyzer.py updater.py refresh.py LICENSE README.md; do
              cp "$f" "$dir/"
            done
            if [ -d "docs" ]; then cp -r docs "$dir/docs"; fi

            local wheel="cadquery_ocp_novtk-${OCP_VERSION}-cp313-cp313-${wheel_tag}.whl"
            cp "wheels/$wheel" "$dir/wheels/"
            python ci/make_platform_manifest.py blender_manifest.toml "$plat" "$wheel" "$dir/blender_manifest.toml"

            cp "native/$build_dir/stepper_native.so" "$dir/"
            for tk in TKernel TKMath TKBRep TKG2d TKG3d TKGeomBase TKGeomAlgo TKTopAlgo TKShHealing TKMesh; do
              for f in "$occt_prefix"/lib/lib${tk}.*dylib*; do
                [ -e "$f" ] && cp -P "$f" "$dir/native_libs/" || true
              done
            done
            # Pull in extra conda deps of the TK subset (tbb etc.)
            for lib in "$dir/native_libs"/*.dylib*; do
              [ -f "$lib" ] || continue
              otool -L "$lib" | awk '{print $1}' | while read dep; do
                case "$dep" in
                  */lib/*|@rpath/*)
                    base=$(basename "$dep")
                    if [ ! -e "$dir/native_libs/$base" ] && [ -e "$occt_prefix/lib/$base" ]; then
                      cp "$occt_prefix/lib/$base" "$dir/native_libs/"
                    fi
                    ;;
                esac
              done
            done
          }
          assemble macos-arm64 macosx_11_0_arm64 build-arm64 "$CONDA_PREFIX"
          assemble macos-x64 macosx_11_0_x86_64 build-x64 "$GITHUB_WORKSPACE/occt-x64"

      - name: Fix dylib paths and sign (native module only)
        run: |
          set +e
          fix_deps() {
            local target="$1" rpath_prefix="$2"
            otool -L "$target" 2>/dev/null | awk '{print $1}' | while read dep; do
              case "$dep" in
                */conda*|*/occt-x64/*|@rpath/*)
                  dep_basename=$(basename "$dep")
                  install_name_tool -change "$dep" "${rpath_prefix}${dep_basename}" "$target" 2>/dev/null || true
                  ;;
              esac
            done
          }
          fix_tree() {
            local dir="$1"
            find "$dir/native_libs" -name "*dylib*" -type f | while IFS= read -r lib; do
              fix_deps "$lib" "@loader_path/"
              install_name_tool -id "@loader_path/$(basename "$lib")" "$lib" 2>/dev/null || true
              codesign --force --sign - "$lib" 2>/dev/null || true
            done
            fix_deps "$dir/stepper_native.so" "@loader_path/native_libs/"
            codesign --force --sign - "$dir/stepper_native.so" 2>/dev/null || true
          }
          fix_tree STEPper_NEXT-macos-arm64
          fix_tree STEPper_NEXT-macos-x64

      - name: Smoke test (arm64 only, x64 module can't load in arm python)
        run: |
          cd STEPper_NEXT-macos-arm64 && unzip -q wheels/*.whl -d test_site && cd ..
          PYTHONPATH="$PWD/STEPper_NEXT-macos-arm64/test_site" python ci/smoke_test.py STEPper_NEXT-macos-arm64
          rm -rf STEPper_NEXT-macos-arm64/test_site
          # x64: structural check only
          lipo -archs STEPper_NEXT-macos-x64/stepper_native.so | grep -q x86_64
          for lib in STEPper_NEXT-macos-x64/native_libs/libTKernel.*.dylib; do
            lipo -archs "$lib" | grep -q x86_64
          done

      - name: Create zips
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('blender_manifest.toml','rb'))['version'])")
          (cd STEPper_NEXT-macos-arm64 && zip -qr "../stepper_next-${VERSION}-macos_arm64.zip" .)
          (cd STEPper_NEXT-macos-x64 && zip -qr "../stepper_next-${VERSION}-macos_x64.zip" .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: stepper_next-*-macos_*.zip

  # ════════════════════════════════════════════════════════════════════
  # Linux (linux-x64)
  # ════════════════════════════════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        # -e/-o pipefail: GitHub only injects fail-fast for the builtin
        # `shell: bash`; a custom template must ask for it explicitly, or
        # every multi-line step passes as long as its LAST command succeeds
        shell: bash -leo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install patchelf
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
          python-version: '3.13'

      - name: Install OCCT and build tools
        run: |
          conda install -y -c conda-forge occt=${OCCT_VERSION}=novtk* numpy cmake ninja

      - name: Build stepper_native
        run: |
          cd native
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$CONDA_PREFIX/bin/python3"
          cmake --build . --config Release

      - name: Assemble extension
        run: |
          ADDON_DIR="STEPper_NEXT"
          mkdir -p "$ADDON_DIR/wheels" "$ADDON_DIR/native_libs"

          for f in __init__.py main.py importer.py import_ui.py uv.py tools.py formats.py curves.py analyzer.py background.py worker.py trimesh.py nurbs.py ocp_utils.py stepanalyzer.py updater.py refresh.py LICENSE README.md; do
            cp "$f" "$ADDON_DIR/"
          done
          if [ -d "docs" ]; then cp -r docs "$ADDON_DIR/docs"; fi

          WHEEL="cadquery_ocp_novtk-${OCP_VERSION}-cp313-cp313-manylinux_2_31_x86_64.whl"
          cp "wheels/$WHEEL" "$ADDON_DIR/wheels/"
          python ci/make_platform_manifest.py blender_manifest.toml linux-x64 "$WHEEL" "$ADDON_DIR/blender_manifest.toml"

          cp native/build/stepper_native.so "$ADDON_DIR/"
          for tk in TKernel TKMath TKBRep TKG2d TKG3d TKGeomBase TKGeomAlgo TKTopAlgo TKShHealing TKMesh; do
            for f in "$CONDA_PREFIX"/lib/lib${tk}.so*; do
              [ -e "$f" ] && cp -P "$f" "$ADDON_DIR/native_libs/" || true
            done
          done
          # Pull in extra conda deps of the TK subset (tbb etc.)
          for lib in "$ADDON_DIR/native_libs"/*.so*; do
            [ -f "$lib" ] || continue
            if [ -L "$lib" ]; then continue; fi
            ldd "$lib" 2>/dev/null | awk '/=>/ {print $3}' | while read dep; do
              case "$dep" in
                "$CONDA_PREFIX"*)
                  base=$(basename "$dep")
                  if [ ! -e "$ADDON_DIR/native_libs/$base" ]; then
                    cp "$dep" "$ADDON_DIR/native_libs/"
                  fi
                  ;;
              esac
            done || true
          done

      - name: Fix rpaths (native module only)
        run: |
          for so in STEPper_NEXT/native_libs/*.so*; do
            [ -f "$so" ] || continue
            if [ -L "$so" ]; then continue; fi
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done
          patchelf --set-rpath '$ORIGIN/native_libs' STEPper_NEXT/stepper_native.so

      - name: Smoke test
        run: |
          cd STEPper_NEXT && unzip -q wheels/*.whl -d test_site && cd ..
          PYTHONPATH="$PWD/STEPper_NEXT/test_site" python ci/smoke_test.py STEPper_NEXT
          rm -rf STEPper_NEXT/test_site

      - name: Create zip
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('blender_manifest.toml','rb'))['version'])")
          (cd STEPper_NEXT && zip -qr "../stepper_next-${VERSION}-linux_x64.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: stepper_next-*-linux_x64.zip

  # ════════════════════════════════════════════════════════════════════
  # Create GitHub Release (runs after all builds complete)
  # ════════════════════════════════════════════════════════════════════
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # Only create release on tag push or manual dispatch with version
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: STEPper NEXT ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## STEPper NEXT ${{ github.event.inputs.version || github.ref_name }}

            Blender **extension** packages (Blender 5.1+, Python 3.13). The
            OpenCASCADE (OCP) bindings ship as a bundled wheel that Blender
            installs automatically.

            ### Downloads
            - **Windows (64-bit):** `stepper_next-*-windows_x64.zip`
            - **macOS Apple Silicon:** `stepper_next-*-macos_arm64.zip`
            - **macOS Intel:** `stepper_next-*-macos_x64.zip`
            - **Linux (64-bit):** `stepper_next-*-linux_x64.zip`

            ### Installation
            1. Download the `.zip` for your platform
            2. In Blender: **Edit > Preferences > Get Extensions >** (drop-down top-right) **> Install from Disk...** → select the `.zip` (or drag & drop the zip into Blender)
            3. Enable it under **Add-ons** if not enabled automatically

            If upgrading from a pre-2.3 legacy addon install, remove the old
            "STEPper NEXT" addon first (Preferences > Add-ons).

            ---
            *Built automatically by GitHub Actions*
          draft: false
          prerelease: false
          files: artifacts/**/*.zip
          generate_release_notes: true
